name: Build Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo files (for diagnosing)
        run: ls -R

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find gradle project folder
        id: root
        run: |
          f=$(find . -name "settings.gradle" | head -n 1)
          if [ -z "$f" ]; then
            echo "ERROR: settings.gradle not found anywhere in this repo!"
            grep -i "done" /dev/null #
