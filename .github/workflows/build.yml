name: Build Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Find gradle project folder
        id: root
        shell: bash
        run: |
          f="$(find . -name 'settings.gradle' | head -n 1)"
          test -n "$f"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Building in folder: $(dirname "$f")"

      - name: Build
        run: gradle build
        working-directory: ${{ steps.root.outputs.dir }}

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: donutpay-mod
          path: ${{ steps.root.outputs.dir }}/build/libs/*.jar
