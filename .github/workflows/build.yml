name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: gradle wrapper && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: donutpay-mod
          path: build/libs/*.jar
